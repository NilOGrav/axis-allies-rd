umn in the CSV exactly.","# Domains in the CSV but missing here are appended at the bottom with","# the default colour (a warning is printed). Domains listed here but","# absent from the CSV are ignored (a warning is printed).","# Colours must be #RRGGBB.","","[[domains]]","name  = \"Air\"","color = \"#cfe8ff\"","","[[domains]]","name  = \"Land\"","color = \"#d9f2d9\"","","[[domains]]","name  = \"Naval\"","color = \"#fff2cc\"","","[[domains]]","name  = \"Programs\"","color = \"#ffd9b3\"","","[[domains]]","name  = \"Research\"","color = \"#ffdefe\"","","[[domains]]","name  = \"Manufacturing\"","color = \"#c4a6ff\"","","[[domains]]","name  = \"Intelligence\"","color = \"#e0f7fa\"","","[[domains]]","name  = \"Energy\"","color = \"#f8d7da\"","","# ── Colours ─────────────────────────────────────────────────────────","[colors]","default_domain = \"black\"   # fill for a domain that is not configured","cluster_darken = 0.82      # cluster background = domain colour * factor","or_groups = [              # cycled through for OR dependency groups","    \"#e41a1c\", \"#377eb8\", \"#4daf4a\",","    \"#984ea3\", \"#ff7f00\", \"#ffff33\",","    \"#a65628\", \"#f781bf\",","]","","# ── Dimming for --view (non-highlighted nodes) ──────────────────────","[dim.grey]","fillcolor  = \"#dddddd\"","color      = \"#bbbbbb\"","fontcolor  = \"#aaaaaa\"","edge_color = \"#dddddd\"","","[dim.fade]","blend        = 0.2         # 0 = white, 1 = full domain colour","unknown_fill = \"#f5f5f5\"   # used for domains without a colour","color        = \"#cccccc\"","fontcolor    = \"#cccccc\"","edge_color   = \"#dddddd\"","","# ── Graphviz geometry ───────────────────────────────────────────────","# Node width/height and nodesep/ranksep also drive the grid spacing","# of the neato renderer.","[dot_view]","name = \"TechTree\"","","[dot_view.graph]","rankdir     = \"LR\"","splines     = \"polyline\"","compound    = true","clusterrank = \"local\"","newrank     = true","pad         = 0.5","nodesep     = 0.